name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Décompresser et compiler
        run: |
          mkdir proj
          unzip -q *.zip -d proj
          cd "$(dirname "$(find proj -name gradlew | head -n 1)")"
          chmod +x gradlew
          ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: proj/**/build/libs/*.jar
